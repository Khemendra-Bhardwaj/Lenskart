version: '3.3'

# TODO : health checkups & retry mechanisms for database and backend & frontend services 
services:
  # PostgreSQL Database
  db:
    image: postgres:14
    container_name: postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lenskartDB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  # Backend Express API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: backend-server 
    restart: unless-stopped
    environment:
      # NODE_ENV: production
      PORT: 4000
      DB_PORT: 5432
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: lenskartDB
    ports:
      - "4000:4000"
    depends_on:
      - db
    networks:
      - app-network

  # Frontend React App
  # frontend:
  #   build:
  #     context: ./client
  #     dockerfile: Dockerfile
  #   container_name: react-app
  #   restart: unless-stopped
  #   ports:
  #     - "3000:80"
  #   # environment:
  #   #   REACT_APP_API_URL: http://localhost:4000/api
  #   depends_on:
  #     - backend
  #   networks:
  #     - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: