version: '3.3'

# TODO : health checkups & retry mechanisms for database and backend & frontend services 
services:
  # PostgreSQL Databases
  user-db:
    image: postgres:14
    container_name: user-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: userDB
    ports:
      - "5432:5432"
    volumes:
      - user_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-db:
    image: postgres:14
    container_name: product-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: productDB
    ports:
      - "5433:5432"
    volumes:
      - product_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:latest
    container_name: redis
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  # Backend Express API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: backend-server 
    restart: unless-stopped
    environment:
      # NODE_ENV: production
      PORT: 4000
      USER_DB_PORT: 5432
      USER_DB_HOST: user-db
      USER_DB_USER: postgres
      USER_DB_PASSWORD: postgres
      USER_DB_NAME: userDB
      PRODUCT_DB_PORT: 5432
      PRODUCT_DB_HOST: product-db
      PRODUCT_DB_USER: postgres
      PRODUCT_DB_PASSWORD: postgres
      PRODUCT_DB_NAME: productDB
      REDIS_HOST: redis
      REDIS_PORT: 6379

    env_file:
      - .env 
    ports:
      - "4000:4000"
    depends_on:
      - user-db
      - product-db
      - redis 
      # - orders-db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  user_data:
  product_data:
  redis-data: 
  # orders_data:

networks:
  app-network:
    driver: bridge